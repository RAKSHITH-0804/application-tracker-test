<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth - Sign In</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="firebase-auth-bg">
    <div class="firebase-auth-wrapper">
        <div class="firebase-auth-card">
            <!-- Firebase Flame Logo Header -->
            <div class="firebase-logo-header">
                <svg class="firebase-flame-icon" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M106.8 388.2L182.2 46.8C184.6 35.7 199.8 34.4 204.1 44.9L247.9 152L106.8 388.2Z" fill="#FFA000"/>
                    <path d="M305.6 211.2L248 152L106.8 388.2L305.6 211.2Z" fill="#F58220"/>
                    <path d="M403.9 388.2L348.9 83.5C346.8 71.9 331.4 69.8 326.3 80.3L287 160.7L403.9 388.2Z" fill="#FFCA28"/>
                    <path d="M106.8 388.2L251.3 469.7C254.3 471.4 257.9 471.4 260.9 469.7L403.9 388.2L305.6 211.2L106.8 388.2Z" fill="#FFA000"/>
                </svg>
                <h1 class="firebase-auth-title">Sign in to Firebase</h1>
                <p class="firebase-auth-subtitle">Job Pipeline Console Authentication</p>
            </div>

            <!-- Google Sign In Option -->
            <button type="button" class="google-auth-btn" id="google-signin-btn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>

            <!-- Divider -->
            <div class="auth-divider">
                <span>or email</span>
            </div>

            <!-- Error Box -->
            <div id="error-message" class="alert-box error hidden"></div>

            <!-- Email & Password Form -->
            <form id="login-form" class="firebase-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" required placeholder="user@example.com" class="form-input">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="form-input">
                </div>

                <button type="submit" class="firebase-primary-btn">Sign In</button>
            </form>

            <div class="firebase-auth-footer">
                <p>Need a Firebase account? <a href="/signup">Create account</a></p>
            </div>
        </div>
    </div>
    
    <script src="/login.js"></script>

    <script>
        document.getElementById('google-signin-btn').addEventListener('click', () => {
            alert('Google Sign-In requires Firebase API Key credentials configured.');
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-message');
            
            errorBox.classList.add('hidden');
            errorBox.innerText = '';
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorBox.innerText = data.detail || 'Authentication failed.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.innerText = 'Network error or server unavailable.';
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
