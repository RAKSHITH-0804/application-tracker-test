<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Job Tracker - Register Account</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dossier-body">
    <div class="folder-container">
        <div class="folder-tab">🔥 FIREBASE AUTHENTICATION</div>
        <div class="dossier-card">
            <h1 class="dossier-title">Create Account</h1>
            <p class="subtitle">Establish access to the Firebase Job Pipeline Console</p>
            
            <div id="error-message" class="alert-box error hidden"></div>
            <div id="success-message" class="alert-box success hidden"></div>
            
            <form id="signup-form" class="dossier-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" required placeholder="user@domain.com" class="form-input">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" required placeholder="Min 6 characters" class="form-input" minlength="6">
                </div>
                
                <button type="submit" class="stamp-btn">REGISTER ACCOUNT &gt;&gt;</button>
            </form>
            
            <div class="form-footer">
                <p>Already registered? <a href="/login" class="dossier-link">Sign In &gt;&gt;</a></p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-message');
            const successBox = document.getElementById('success-message');
            
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');
            errorBox.innerText = '';
            successBox.innerText = '';
            
            try {
                const response = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    successBox.innerText = 'Account established! Redirecting to sign in...';
                    successBox.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    errorBox.innerText = data.detail || 'Registration failed.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.innerText = 'Network error or server unavailable.';
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
